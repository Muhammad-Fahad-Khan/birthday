<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12021f" />
    <meta name="description" content="A little universe, made for your birthday." />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Happy Birthday, My Love Mano" />
    <meta property="og:description" content="A little universe, made for your birthday." />

    <title>Happy Birthday, My Love Mano</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap"
    />
  </head>

  <body class="is-loading">
    <!-- Atmosphere layers -->
    <div class="backdrop" aria-hidden="true"></div>
    <canvas class="webgl" id="webgl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <!-- Preloader / gift opener -->
    <div class="preloader" data-preloader role="dialog" aria-label="Loading your surprise">
      <div class="preloader__heart">
        <svg viewBox="0 0 100 90" aria-hidden="true">
          <path
            class="preloader__fill"
            d="M50 84C20 62 4 46 4 27 4 14 14 4 27 4c10 0 18 6 23 14 5-8 13-14 23-14 13 0 23 10 23 23 0 19-16 35-46 57z"
          />
          <path
            class="preloader__stroke"
            pathLength="1"
            d="M50 84C20 62 4 46 4 27 4 14 14 4 27 4c10 0 18 6 23 14 5-8 13-14 23-14 13 0 23 10 23 23 0 19-16 35-46 57z"
          />
        </svg>
        <span class="preloader__count" data-preloader-count>0</span>
      </div>
      <p class="preloader__text" data-preloader-text>Preparing something special…</p>
      <button class="btn btn--primary preloader__btn" type="button" data-preloader-btn hidden>
        Open your surprise <span aria-hidden="true">💝</span>
      </button>
    </div>

    <!-- Heads-up display -->
    <header class="hud" data-hud>
      <a class="hud__brand" href="#hero" data-nav-link="0" aria-label="Back to the beginning">
        <span class="hud__brand-heart" aria-hidden="true">♥</span>
        <span class="hud__brand-name" data-brand-name></span>
      </a>
      <button class="hud__music" type="button" data-music-toggle aria-pressed="false" aria-label="Play music">
        <span class="hud__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="hud__music-label">Music</span>
      </button>
    </header>
    <nav class="section-nav" data-section-nav aria-label="Sections"></nav>
    <div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>

    <!-- Custom cursor (desktop only) -->
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot" data-cursor-dot></div>
      <div class="cursor__ring" data-cursor-ring></div>
    </div>

    <main id="app">
      <section class="section hero" id="hero" data-scene="0" data-label="Hello"></section>
      <section class="section wishes" id="wishes" data-scene="1" data-label="Wishes"></section>
      <section class="section story" id="story" data-scene="1" data-label="Our story"></section>
      <section class="section memories" id="memories" data-scene="2" data-label="Memories"></section>
      <section class="section celebrate" id="celebrate" data-scene="3" data-label="Make a wish"></section>
      <section class="section letter" id="letter" data-scene="4" data-label="Your letter"></section>
      <section class="section finale" id="finale" data-scene="4" data-label="Forever"></section>
    </main>

    <noscript>
      <div class="noscript">This little surprise needs JavaScript to come alive. Please enable it 💌</div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
